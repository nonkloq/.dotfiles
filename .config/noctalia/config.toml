[accessibility]
ui_scale = 1.1500000096857548

[audio]
colorize_icons = true
enable_overdrive = true
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    border_width = 0.0
    capsule_fill = "outline_variant"
    capsule_opacity = 0.0
    capsule_padding = 4.0
    capsule_radius = 17
    capsule_thickness = 0.99999998137354851
    contact_shadow = false
    end = [
        "group:g1",
        "spacer_1",
        "tray",
        "notifications",
        "spacer_3",
        "network",
        "bluetooth",
        "group:g3",
        "volume",
        "input_volume",
        "brightness",
        "spacer_2",
        "control-center",
        "spacer_3",
        "session"
    ]
    font_family = "JetBrainsMono Nerd Font"
    font_weight = 400
    margin_edge = 8
    margin_ends = 8
    margin_opposite_edge = 2
    padding = 15
    radius = 80
    radius_top_left = 80
    radius_top_right = 80
    scale = 1.1000000089406967
    shadow = true
    start = [ "workspaces", "spacer_4", "temp", "cpu", "ram", "group:g2", "recorder" ]
    thickness = 30

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = false
        fill = "surface_container"
        id = "g2"
        members = [ "network_tx", "network_rx" ]
        opacity = 0.74000000953674316
        padding = 11.0
        radius = 16.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "outline_variant"
        id = "g1"
        members = [ "audio_visualizer", "media" ]
        opacity = 0.0
        padding = 4.0
        radius = 17.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "outline_variant"
        id = "g3"
        members = [ "battery", "power_profile" ]
        opacity = 0.0
        padding = 4.0
        radius = 17.0

[control_center]
