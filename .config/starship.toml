palette = "noctalia"
add_newline = true

format = """$os\
$directory\
$git_branch$git_commit$git_state$git_status \
$singularity\
$kubernetes\
$vcsh\
$hg_branch\
$pijul_channel\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$zig\
$buf\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$cpp\
$kotlin\
$ocaml\
$pixi\
$rlang\
$php\
$crystal\
$line_break\
$character"""

right_format = """
$custom\
$status\
$cmd_duration\
$time"""

continuation_prompt = '▶ '


[time]
disabled = true
format = '[[  $time ](fg:subtext1)]($style)'
time_format = "%I:%M %p"                            # Hour:Minute AM/PM Format
# format = "\\[[$time]($style)\\]"

[os]
format = "[$symbol](lavender) "
disabled = false

[character]
success_symbol = "[❯](lavender)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[directory]
format = "[$path](bold $style)[$read_only]($read_only_style) "
truncation_length = 2
style = "fg:blue"
read_only_style = "fg:subtext1"
before_repo_root_style = "fg:sapphire"
truncation_symbol = "…/"
truncate_to_repo = false
read_only ="  "
# read_only = "󰌾"

[git_commit]
tag_symbol = '  '

[git_branch]
format = "\\[[$symbol$branch]($style)\\]"
symbol = " "

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = "([\\[$all_status$ahead_behind\\]]($style))"


# --- dev environments ---
[aws]
format = "\\[[$symbol($profile)(\\($region\\))(\\[$duration\\])]($style)\\]"
symbol = ""

[bun]
format = "\\[[$symbol($version)]($style)\\]"
symbol = " "

[c]
format = "\\[[$symbol($version(-$name))]($style)\\]"
symbol = " "

[cpp]
format = "\\[[$symbol($version(-$name))]($style)\\]"
symbol = " "

[cmake]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[cmd_duration]
format = '\[[⏱ $duration]($style)\]'

[cobol]
format = "\\[[$symbol($version)]($style)\\]"

[conda]
format = "\\[[$symbol$environment]($style)\\]"
symbol = " "

[crystal]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[daml]
format = "\\[[$symbol($version)]($style)\\]"

[dart]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[deno]
format = "\\[[$symbol($version)]($style)\\]"
symbol = " "

[docker_context]
format = "\\[[$symbol$context]($style)\\]"
symbol = " "

[dotnet]
format = "\\[[$symbol($version)(🎯 $tfm)]($style)\\]"

[elixir]
format = "\\[[$symbol($version \\(OTP $otp_version\\))]($style)\\]"
symbol = ""

[elm]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[erlang]
format = "\\[[$symbol($version)]($style)\\]"

[fennel]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[fossil_branch]
format = "\\[[$symbol$branch]($style)\\]"
symbol = ""

[gcloud]
format = "\\[[$symbol$account(@$domain)(\\($region\\))]($style)\\]"
symbol = ""


[golang]
format = "\\[[$symbol($version)]($style)\\]"
symbol = " "

[gradle]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[guix_shell]
format = "\\[[$symbol]($style)\\]"
symbol = ""

[haskell]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[haxe]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[helm]
format = "\\[[$symbol($version)]($style)\\]"

[hg_branch]
format = "\\[[$symbol$branch]($style)\\]"
symbol = ""

[java]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[julia]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[kotlin]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[kubernetes]
format = "\\[[$symbol$context( \\($namespace\\))]($style)\\]"

[lua]
format = "\\[[$symbol($version)]($style)\\]"
symbol = " "

[memory_usage]
format = "\\[$symbol[$ram( | $swap)]($style)\\]"
symbol = "󰍛"

[meson]
format = "\\[[$symbol$project]($style)\\]"
symbol = "󰔷"

[nim]
format = "\\[[$symbol($version)]($style)\\]"
symbol = "󰆥"

[nix_shell]
format = "\\[[$symbol$state( \\($name\\))]($style)\\]"
symbol = ""

[nodejs]
format = "\\[[$symbol($version)]($style)\\]"
symbol = " "

[ocaml]
format = "\\[[$symbol($version)(\\($switch_indicator$switch_name\\))]($style)\\]"
symbol = ""

[opa]
format = "\\[[$symbol($version)]($style)\\]"

[openstack]
format = "\\[[$symbol$cloud(\\($project\\))]($style)\\]"

[package]
format = "\\[[$symbol$version]($style)\\]"
symbol = "󰏗"

[perl]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[php]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[pijul_channel]
format = "\\[[$symbol$channel]($style)\\]"
symbol = ""

[pixi]
format = "\\[[$symbol$version( $environment)]($style)\\]"
symbol = "󰏗"

[pulumi]
format = "\\[[$symbol$stack]($style)\\]"

[purescript]
format = "\\[[$symbol($version)]($style)\\]"

[python]
format = "\\[[${symbol}${pyenv_prefix}(${version})(\\($virtualenv\\))]($style)\\]"
symbol = " "

[raku]
format = "\\[[$symbol($version-$vm_version)]($style)\\]"

[red]
format = "\\[[$symbol($version)]($style)\\]"

[ruby]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[rust]
format = "\\[[$symbol($version)]($style)\\]"
symbol = "󱘗 "

[scala]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[spack]
format = "\\[[$symbol$environment]($style)\\]"

[sudo]
format = "\\[[as $symbol]($style)\\]"

[swift]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[terraform]
format = "\\[[$symbol$workspace]($style)\\]"

[username]
format = "\\[[$user]($style)\\]"

[vagrant]
format = "\\[[$symbol($version)]($style)\\]"

[vlang]
format = "\\[[$symbol($version)]($style)\\]"

[zig]
format = "\\[[$symbol($version)]($style)\\]"
symbol = ""

[solidity]
format = "\\[[$symbol($version)]($style)\\]"

[buf]
symbol = ""

[hostname]
ssh_symbol = " "

[rlang]
symbol = "󰟔 "

