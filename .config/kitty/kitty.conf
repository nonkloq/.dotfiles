# --- Window Settings ---
# In Alacritty you set an empty title and disable dynamic title updates.
# In Kitty, you can override the window title, but note that it will normally
# display the current running command's title.
window_title ""

# Set background opacity (Kitty supports this directly)
# background_opacity 0.86

# Remove window decorations
hide_window_decorations yes

# Note: Kitty does not have a built-in blur setting. 
# To achieve blur, you may need to rely on your compositor or desktop effects.

# --- Font Settings ---
# Set the primary font family and size.
font_family JetBrainsMono Nerd Font
font_size 14.0

shell_integration no-cursor
cursor_shape block

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
tab_bar_edge top
